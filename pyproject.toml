[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cripto-core"
version = "0.1.0"
description = "Pure Decimal contracts, synthetic execution arithmetic and SMA"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.uv]
required-version = "==0.12.19"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cripto_core*"]
namespaces = false

[tool.setuptools.package-data]
cripto_core = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib --basetemp=.pytest-tmp"
